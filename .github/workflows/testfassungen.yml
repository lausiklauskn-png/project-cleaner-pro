# Testfassungen zum Ausprobieren (Klaus 2026-10-29): Android-APK (Debug, ohne eigenen Schlüssel) und Windows-Setup
# (unsigniert). Gebaut wie Private Brain Pro: Capacitor 8.5.3 und Tauri 2. Auf main wird beides als Vorab-Veröffentlichung
# „testfassung“ abgelegt (feste Adresse, jede neue Fassung ersetzt die alte). Keine Geheimnisse nötig.
name: Testfassungen (Android und Windows)

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testfassungen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Android-Werkzeuge
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - run: npm ci --ignore-scripts
      - name: Web-Dateien in die Hülle
        run: npm run sync:android
      - name: APK bauen (Debug)
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug
      - name: Benennen und Prüfsumme
        run: |
          F=$(grep -oP 'APP_FASSUNG = "\K[0-9]+' assets/app.js)
          mkdir -p aus
          cp android/app/build/outputs/apk/debug/app-debug.apk "aus/Projekt-Reiniger-Pro-Test-$F.apk"
          (cd aus && sha256sum *.apk > "Projekt-Reiniger-Pro-Test-$F.apk.sha256" && cat *.sha256 && ls -la)
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: aus/*, if-no-files-found: error, retention-days: 30 }

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: windows
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "windows/src-tauri -> target" }
      - name: Setup bauen (NSIS, unsigniert)
        working-directory: windows
        run: npx tauri build --bundles nsis
      - name: Benennen und Prüfsumme
        shell: bash
        run: |
          F=$(grep -oP 'APP_FASSUNG = "\K[0-9]+' assets/app.js)
          mkdir -p aus
          cp windows/src-tauri/target/release/bundle/nsis/*-setup.exe "aus/Projekt-Reiniger-Pro-Test-$F-Windows-Setup.exe"
          (cd aus && sha256sum *.exe > "Projekt-Reiniger-Pro-Test-$F-Windows-Setup.exe.sha256" && cat *.sha256 && ls -la)
      - uses: actions/upload-artifact@v4
        with: { name: windows-setup, path: aus/*, if-no-files-found: error, retention-days: 30 }

  veroeffentlichen:
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: aus, merge-multiple: true }
      - name: Vorab-Veröffentlichung „testfassung“ ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=$(grep -oP 'APP_FASSUNG = "\K[0-9]+' assets/app.js)
          ls -la aus
          cat > notiz.md <<NOTIZ
          **Testfassung $F zum Ausprobieren — nicht das fertige Produkt.** Stand: \`${GITHUB_SHA::7}\`.

          - **Android:** die \`.apk\` laden und öffnen (vorher „Installieren aus dieser Quelle“ erlauben). Debug-Schlüssel: vor einer neueren Testfassung die alte App deinstallieren.
          - **Windows:** \`…-Windows-Setup.exe\` laden und starten. Unsigniert — Windows zeigt „Der Computer wurde durch Windows geschützt“: **Weitere Informationen → Trotzdem ausführen**. Installiert nur für den eigenen Benutzer, ohne Administrator.
          - **PWA:** https://lausiklauskn-png.github.io/project-cleaner-pro/

          Prüfsummen (SHA-256) liegen jeweils daneben. Alles läuft auf dem Gerät; die App geht nicht ins Netz.
          NOTIZ
          gh release delete testfassung --yes --cleanup-tag || true
          gh release create testfassung aus/* --prerelease --target "$GITHUB_SHA" --title "Testfassung $F (zum Ausprobieren)" --notes-file notiz.md
